# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-logic"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-logic"
description = "The Logic capability: a Stream that arrived on a transport becomes a named operation with typed arguments, and an operation's result becomes a Stream again, a contract typing both."

[lib]
path = "src/lib.rs"

[dependencies]
# The Stream an operation's arguments and result travel as, and the contract
# that types them. Transport is not here: a Logic technology reads what a
# transport delivered and writes what a transport will carry, through the
# Arrival and Request shapes below, never through a socket.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
